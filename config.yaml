# Configuration centrale du projet.
# Tous les parametres sont ici : aucun chemin, CRS, seuil ou nom de champ code en dur ailleurs.
# Charge par config_loader.py.

# --- Systemes de coordonnees ---
crs_cible: "EPSG:2950"              # NAD83(CSRS) / MTM zone 8 : CRS commun a toutes les couches
crs_sources:                        # CRS d'origine de chaque source (reference et audit)
  osm: "EPSG:4326"
  aires_diffusion: "EPSG:3347"
  limites_municipales: "EPSG:4269"
  utilisation_sol: "EPSG:32188"
  transport_exo: "EPSG:4326"

# --- Zone d'etude ---
# Les quatre municipalites riveraines contigues forment la zone d'etude au
# complet. La demande, les services, le reseau et le transport y sont tous
# mesures, sans zone tampon, les services se concentrent au coeur des villes.
zone_etude:
  municipalites:
    - "Beloeil"
    - "Mont-Saint-Hilaire"
    - "McMasterville"
    - "Otterburn Park"
  champ_nom_municipalite: "MUS_NM_MUN"   # dans munic_s (limites municipales, polygones)
  rive_ouest:                            # municipalites a l'ouest du Richelieu (pour l'effet de barriere)
    - "Beloeil"
    - "McMasterville"
  rive_est:                              # municipalites a l'est du Richelieu
    - "Mont-Saint-Hilaire"
    - "Otterburn Park"

# --- Reseau pietonnier (OSMnx) ---
reseau_pieton:
  network_type: "walk"              # rues, trottoirs et sentiers marchables (comme GMQ210)

# --- Batiments residentiels (etiquettes OSM) ---
batiments_residentiels:
  champ: "building"
  # Valeurs retenues comme residentielles : liste de GMQ210 completee des
  # valeurs usuelles en banlieue quebecoise (house, bungalow, duplex).
  # La valeur generique "yes" est ambigue : elle ne compte comme residentielle
  # que si le batiment tombe dans un polygone d'usage residentiel de la CMM
  # (codes 100 a 114). Les types ecartes seront journalises par l'audit.
  types_retenus: ["house", "detached", "apartments", "residential", "yes",
                  "static_caravan", "semidetached_house", "terrace", "farm",
                  "bungalow", "duplex"]
  codes_sol_residentiels: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114]
  tag_adresses: "addr:housenumber"  # noeuds d'adresse isoles, complement des batiments (comme GMQ210)

# --- Marche a pied ---
# Deux mesures complementaires (voir README) :
#  - couverture : un lieu est couvert si un service est atteint a pied sous le seuil
#  - cote par type de service : paliers de distance repris de GMQ210
seuils_couverture_m: [400, 800]     # bassins pietons usuels (~5 et ~10 min), adaptes aux aines
seuils_cote_m:                      # repris de GMQ210 : [distance max en m, cote]
  - [1000, 4]                       # moins de 1 km : cote 4
  - [2000, 3]                       # 1 a 2 km : cote 3
  - [3000, 2]                       # 2 a 3 km : cote 2
  - [999999, 1]                     # plus de 3 km : cote 1

# --- Acces au transport collectif (reseau fixe) ---
transport:
  distance_max_arret_m: 500         # un arret compte comme accessible s'il est a <= 500 m a pied
  route_types_fixes: [3]            # GTFS : 3 = autobus (reseau fixe)
  route_types_exclus: [1501]        # GTFS : 1501 = sur reservation (a la demande, exclu)
  champ_lat: "stop_lat"
  champ_lon: "stop_lon"
  gares_pertinentes: ["Gare McMasterville", "Gare Mont-Saint-Hilaire"]  # points d'acces (ligne Mont-Saint-Hilaire)
  ligne_train_contexte: "Ligne Mont-Saint-Hilaire"                      # gardee pour la carte et comme corridor indicatif, pas comme point d'acces

# --- Demande et vulnerabilite ---
vulnerabilite:
  critere: "65 ans et plus"
  caracteristique_id: 24            # ID_CARACTERISTIQUE du 65 ans et plus (compte)
  population_totale_id: 1           # ID_CARACTERISTIQUE de la population totale 2021
  colonne_valeur: "C1_CHIFFRE_TOTAL"
  champ_jointure_ad: "IDUGD"        # cle limites <-> profil (aussi ADIDU disponible)
  encodage_csv: "latin-1"           # encodage du profil StatCan (colonnes accentuees)
  colonne_caracteristique: "ID_CARACTÉRISTIQUE"   # nom exact de la colonne dans le CSV

# --- Services essentiels (etiquettes OSM) ---
services_essentiels:
  epicerie:
    shop: ["supermarket", "grocery", "convenience", "greengrocer"]
  pharmacie:
    amenity: ["pharmacy"]
  sante:
    amenity: ["clinic", "doctors", "hospital"]
  banque:
    amenity: ["bank"]
  poste:
    amenity: ["post_office"]
  ecole:
    amenity: ["school"]
  bibliotheque:
    amenity: ["library"]
  communautaire:
    amenity: ["social_facility", "community_centre"]

# --- Utilisation du sol (filtrage des sites candidats) ---
utilisation_sol:
  champ_code: "UTIL_SOL"
  # Codes CMM exclus comme sites candidats :
  #   100-114 residentiel (on n'implante pas un service dans une cour),
  #   400 industrie, 600 parc/espace vert, 700/710/720/725/750/760 utilite publique et infrastructure,
  #   800 agricole, 1000 hydrographie, 1100 golf.
  # Conserves comme candidats : 200 commerciale, 300 bureau,
  #   510/520 institutionnel, 900 terrain vacant (souvent le meilleur candidat).
  codes_exclus: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114,
                 400, 600, 700, 710, 720, 725, 750, 760, 800, 1000, 1100]

# --- Optimisation (spopt, couverture maximale) ---
optimisation:
  n_services_min: 1
  n_services_max: 8
  seuil_couverture_m: 800                        # un lieu est couvert si le service est a moins de 800 m de marche
  espacement_sites_m: 500                        # distance minimale entre deux sites ajoutes (zones distinctes)
  cartes_aux_etapes: [2, 4, 6, 8]                # etapes du panier qui produisent une carte
  ponderations: ["aines", "population_totale"]   # analyse de sensibilite d'equite

# --- Importance des services pour les aines ---
# Ponderation utilisee pour choisir le panier de services a ajouter (S1) et
# pour la couverture moyenne affichee sur les cartes. Les services du
# quotidien essentiels a l'autonomie pesent plus lourd que les services
# occasionnels. L'ecole pese peu, elle sert surtout aux deplacements
# intergenerationnels.
importance_services:
  epicerie: 1.0
  pharmacie: 1.0
  sante: 0.9
  communautaire: 0.8
  banque: 0.7
  poste: 0.5
  bibliotheque: 0.5
  ecole: 0.3

# --- Visualisation (cartes interactives) ---
visualisation:
  couleur_arrets: "#5a5a5a"         # gris, arrets d'autobus
  couleur_gares: "#000000"          # noir, gares et lignes de train
  couleur_services: "#7a4a20"       # brun, services essentiels existants
  couleur_sites: "#7a4a20"          # brun, sites recommandes par l'optimisation
  couleur_riviere: "#9ecae1"        # bleu pale, riviere Richelieu
  couleur_reseau_contour: "#8c8c8c" # contour gris du reseau pietonnier
  couleur_reseau: "#ffffff"         # remplissage blanc du reseau pietonnier
  couleur_zone: "#000000"           # trait noir de la zone tampon
  icone_arret: "fa-bus"
  icone_gare: "fa-train"
  icones_services:                  # pictogrammes FontAwesome par type de service
    epicerie: "fa-cart-shopping"
    pharmacie: "fa-pills"
    sante: "fa-suitcase-medical"
    banque: "fa-building-columns"
    poste: "fa-envelope"
    ecole: "fa-graduation-cap"
    bibliotheque: "fa-book"
    communautaire: "fa-users"

# --- Chemins ---
chemins:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs_maps: "outputs/maps"
  outputs_figures: "outputs/figures"
  outputs_tables: "outputs/tables"
  audit_report: "outputs/tables/audit_report.csv"
  log_file: "logs/pipeline.log"     # journal du pipeline (ignore par Git)
  # Fichiers sources dans data_raw, telecharges manuellement (voir download_data.py)
  fichiers:
    limites_municipales: "decoupages_administratifs_QC/munic_s.shp"
    aires_diffusion: "AD_recensement_2021_CAN/AD_2021.shp"
    utilisation_sol:
      - "CMM_utilisation_sol_2022_VR/Beloeil_sol.shp"
      - "CMM_utilisation_sol_2022_VR/MSH_sol.shp"
      - "CMM_utilisation_sol_2022_VR/McMasterville_sol.shp"
      - "CMM_utilisation_sol_2022_VR/Otterburn_Park_sol.shp"
    profil_recensement: "donnees_recensement_2021_QC/Francais_CSV_data_Quebec.csv"
    gtfs: "google_transit_VR"
    gares_train: "train_gares_exo.geojson"
    lignes_train: "train_lignes_exo.geojson"
  # Fichiers OSM dans data_raw, regeneres par download_data.py
  fichiers_osm:
    graphe_pieton: "osm/network_walk.graphml"
    services: "osm/services.gpkg"
    batiments: "osm/buildings.gpkg"
    adresses: "osm/addresses.gpkg"
    hydrographie: "osm/water.gpkg"
  # Couches intermediaires ecrites dans data_processed (verifiables dans QGIS)
  fichiers_processed:
    residences: "residences.gpkg"
    services: "services.gpkg"
    arrets_bus: "arrets_bus.gpkg"
    gares: "gares.gpkg"
    aires_diffusion: "aires_diffusion.gpkg"
    sites_candidats: "sites_candidats.gpkg"
    profil_recensement: "profil_recensement_filtre.csv"
