# Configuration centrale du projet.
# Tous les parametres sont ici, aucun chemin, CRS, seuil ou nom de champ code en dur ailleurs.
# Charge par config_loader.py. Les cles sont en anglais, les libelles d'affichage restent en francais.

# --- Systemes de coordonnees ---
target_crs: "EPSG:2950"              # NAD83(CSRS) / MTM zone 8, CRS commun a toutes les couches
geographic_crs: "EPSG:4326"          # WGS84, affichage web des cartes et coordonnees des tableaux exportes
source_crs:                          # CRS d'origine de chaque source (reference et audit)
  osm: "EPSG:4326"
  dissemination_areas: "EPSG:3347"
  municipal_limits: "EPSG:4269"
  transit_exo: "EPSG:4326"

# --- Zone d'etude ---
# Les quatre municipalites riveraines contigues forment la zone d'etude au complet.
study_area:
  municipalities:
    - "Beloeil"
    - "Mont-Saint-Hilaire"
    - "McMasterville"
    - "Otterburn Park"
  municipality_name_field: "MUS_NM_MUN"   # dans munic_s (limites municipales, polygones)
  west_bank:                              # municipalites a l'ouest du Richelieu (validation de barriere)
    - "Beloeil"
    - "McMasterville"
  east_bank:                              # municipalites a l'est du Richelieu
    - "Mont-Saint-Hilaire"
    - "Otterburn Park"

# --- Reseau pietonnier (OSMnx) ---
walk_network:
  network_type: "walk"              # rues, trottoirs et sentiers marchables (comme GMQ210)

# --- Batiments residentiels (etiquettes OSM) ---
residential_buildings:
  field: "building"
  # Valeurs retenues comme residentielles, liste de GMQ210 completee des valeurs
  # usuelles en banlieue quebecoise (house, bungalow, duplex). La valeur generique
  # "yes" ne compte comme residentielle que si le batiment tombe dans un polygone
  # OpenStreetMap landuse=residential.
  kept_types: ["house", "detached", "apartments", "residential", "yes",
               "static_caravan", "semidetached_house", "terrace", "farm",
               "bungalow", "duplex"]
  generic_value: "yes"               # valeur de kept_types soumise au croisement d'usage du sol
  address_tag: "addr:housenumber"   # noeuds d'adresse isoles, complement des batiments
  street_field: "addr:street"       # rue de l'adresse, pour l'etiquette affichee
  housenumber_field: "addr:housenumber"

# --- Marche a pied, cotes de proximite ---
# Paliers de distance de marche vers un service, propres a chaque groupe.
# Les aines tolerent des distances plus courtes que le reste de la population.
quality_bands:
  seniors:                          # [distance max en m, libelle]
    - [200, "Excellent"]            # moins de 200 m
    - [400, "Très bien"]            # 200 a 400 m
    - [600, "Bien"]                 # 400 a 600 m
    - [800, "Acceptable"]           # 600 a 800 m
    - [999999, "Insuffisant"]       # plus de 800 m
  rest:                             # [distance max en m, libelle], le reste de la population
    - [400, "Excellent"]            # moins de 400 m
    - [600, "Très bien"]            # 400 a 600 m
    - [800, "Bien"]                 # 600 a 800 m
    - [1000, "Acceptable"]          # 800 a 1000 m
    - [999999, "Insuffisant"]       # plus de 1000 m
# Fraction de points accordee par palier pour un service. Etre proche d'un service
# important pese lourd, etre loin d'un service moins important pese peu.
band_fractions:
  Excellent: 1.0
  Très bien: 0.7
  Bien: 0.5
  Acceptable: 0.3
  Insuffisant: 0.0
# Paliers du pourcentage global d'accessibilite vers le libelle qualitatif d'une residence.
overall_quality_ratios:             # [ratio minimal du pourcentage, libelle]
  - [0.80, "Excellent"]
  - [0.60, "Très bien"]
  - [0.40, "Bien"]
  - [0.20, "Acceptable"]
  - [0.00, "Insuffisant"]

# --- Acces au transport collectif (reseau fixe) ---
transit:
  max_stop_distance_seniors_m: 800     # marche max vers un arret pour un aine, sa distance acceptable
  max_stop_distance_rest_m: 1000       # marche max vers un arret pour le reste de la population
  fixed_route_types: [3]            # GTFS, 3 = autobus (reseau fixe)
  demand_route_types: [1501]        # GTFS, 1501 = sur reservation (a la demande, exclu)
  lat_field: "stop_lat"
  lon_field: "stop_lon"
  relevant_stations: ["Gare McMasterville", "Gare Mont-Saint-Hilaire"]
  context_train_line: "Ligne Mont-Saint-Hilaire"
  station_name_field: "nom_gare"    # nom de gare, fichier des gares exo
  line_name_field: "nom_train"      # nom de ligne, fichier des lignes exo
  line_id_field: "no_train"         # identifiant de ligne, cle de deduplication

# --- Demande et vulnerabilite ---
vulnerability:
  criterion: "65 ans et plus"
  characteristic_id: 24                        # ID_CARACTERISTIQUE du 65 ans et plus (compte)
  total_population_id: 1                        # ID_CARACTERISTIQUE de la population totale 2021
  value_column: "C1_CHIFFRE_TOTAL"
  ad_join_field: "IDUGD"                       # cle limites <-> profil
  csv_encoding: "latin-1"                      # encodage du profil StatCan (colonnes accentuees)
  characteristic_column: "ID_CARACTÉRISTIQUE"  # nom exact de la colonne dans le CSV
  csv_chunksize: 500000                        # lignes par morceau, fichier StatCan de plusieurs Go

# --- Services essentiels (etiquettes OSM) ---
# Cles internes en anglais, un libelle francais est defini plus bas pour l'affichage.
# Seule la sante regroupe plusieurs etiquettes, tous les autres types sont distincts.
# La cle healthcare complete amenity pour la sante, le dentiste et la pharmacie, car
# plusieurs etablissements OSM ne portent que cette etiquette. childcare complete
# kindergarten, etiquette usuelle des garderies au Quebec.
essential_services:
  pharmacy:
    amenity: ["pharmacy"]
    healthcare: ["pharmacy"]
  school:
    amenity: ["school"]
  kindergarten:
    amenity: ["kindergarten", "childcare"]
  bank:
    amenity: ["bank"]
  health:
    amenity: ["hospital", "clinic", "doctors"]
    healthcare: ["hospital", "clinic", "doctor"]
  dentist:
    amenity: ["dentist"]
    healthcare: ["dentist"]
  veterinary:
    amenity: ["veterinary"]
  supermarket:
    shop: ["supermarket"]
  convenience:
    shop: ["convenience"]

# --- Optimisation (spopt, couverture maximale) ---
# Le noyau de couverture maximale sert seulement a la validation qui montre que l'ajout de
# services essentiels ne rapporte pas assez pour etre la solution, pour les deux groupes.
optimization:
  n_service_check: 5                           # services testes pour la validation d'ajout ecarte, de 1 a 5
  coverage_threshold_seniors_m: 800            # un aine est couvert si le service est a moins de 800 m
  coverage_threshold_rest_m: 1000              # le reste de la population tolere jusqu'a 1000 m
  matrix_cutoff_m: 1000                        # portee maximale de la matrice de distances
  site_spacing_m: 300                          # distance minimale entre deux sites retenus
  site_road_max_distance_m: 300                # distance maximale d'un site candidat au reseau pietonnier
  out_of_reach_multiplier: 10.0                # multiplie le seuil pour marquer une paire hors de portee
  coverage_reference_seniors_m: 200            # seuil de reference de la couverture pour les aines (palier Excellent)
  coverage_reference_rest_m: 400               # seuil de reference de la couverture pour le reste (palier Excellent)

# --- Importance des services, deux jeux de poids ---
# Le jeu des aines guide leur cote sur 100, le classement des adresses et le choix des
# sites de logement. Le jeu du reste de la population sert au diagnostic d'equite, il
# montre que ce groupe privilegie des services differents, comme l'ecole et la garderie.
importance_seniors:
  supermarket: 1.0     # Le service le plus utile, on y va presque tous les jours
  pharmacy: 1.0        # Essentiel pour les medicaments et le suivi des soins
  health: 0.9          # Medecin et clinique de proximite, tres important en vieillissant
  convenience: 0.8     # Depannage rapide a pied, tres pratique au quotidien
  bank: 0.6            # Encore utile au comptoir pour ce groupe
  dentist: 0.5         # Soins reguliers mais visites peu frequentes
  veterinary: 0.3      # Utile seulement pour les proprietaires d'animaux
  school: 0.1          # Peu utile au quotidien pour cette population
  kindergarten: 0.1    # Presque jamais utile pour cette population
importance_rest:
  supermarket: 1.0     # Le service le plus utile, on y va tres souvent
  convenience: 0.8     # Pratique pour les achats de derniere minute
  school: 0.8          # Critere important pour les familles
  pharmacy: 0.7        # Important mais moins frequent que l'epicerie
  kindergarten: 0.7    # Important pour les jeunes parents qui travaillent
  health: 0.6          # Utile pour les suivis et urgences, mais moins souvent
  dentist: 0.4         # Visites deux fois par an seulement
  veterinary: 0.3      # Utile seulement pour les proprietaires d'animaux
  bank: 0.2            # Presque tout se fait en ligne pour ce groupe

# --- Visualisation (cartes interactives) ---
visualization:
  # Fond de carte.
  map_zoom_start: 13
  map_tiles: "cartodbpositron"
  font_awesome_cdn: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  # Couleurs, en noms CSS.
  color_stops: "gray"              # bulle grise, arrets d'autobus
  color_stations: "black"          # bulle noire, gares et lignes de train
  color_services: "purple"         # mauve fonce, repere des services essentiels existants
  color_river: "lightblue"         # bleu pale, riviere Richelieu
  color_network_casing: "gray"     # contour gris du reseau pietonnier
  color_network_fill: "white"      # remplissage blanc du reseau pietonnier
  color_study_outline: "black"     # trait noir de la limite de la zone d'etude
  color_municipal_limits: "black"  # trait noir des limites municipales
  color_residence_outline: "black" # contour noir des points de residence
  color_residence_default: "gray"  # gris, cote qualitative absente ou inconnue
  # Couleurs des residences et des secteurs selon la cote qualitative (comme GMQ210).
  quality_colors:
    Excellent: "green"             # vert
    "Très bien": "lightgreen"      # vert pale
    Bien: "yellow"                 # jaune
    Acceptable: "orange"           # orange
    Insuffisant: "red"             # rouge
  # Pictogrammes FontAwesome pour les arrets et gares, en bulles.
  icon_stop: "fa-bus"
  icon_station: "fa-train"
  # Pictogrammes FontAwesome des secteurs du levier, carres au centroide.
  icon_best_address: "fa-house-circle-check"   # secteurs d'adresses existantes
  icon_new_residence: "fa-helmet-safety"       # secteurs ou implanter du logement
  # Noms des couches affiches dans la legende des cartes.
  layer_names:
    study_outline: "Limite de la zone d'étude"
    municipal_limits: "Limites municipales"
    river: "Rivière Richelieu"
    walk_network: "Réseau piétonnier"
    train_lines: "Lignes de train"
    services: "Services essentiels"
    stops: "Arrêts d'autobus"
    stations: "Gares de train"
    residences: "Résidences"
    address_sectors: "Meilleurs secteurs d'adresses existantes"
    site_sectors: "Meilleurs secteurs où implanter des logements"
  # Pictogrammes FontAwesome par type de service, en reperes (marker).
  service_icons:
    pharmacy: "fa-pills"
    school: "fa-graduation-cap"
    kindergarten: "fa-baby-carriage"
    bank: "fa-sack-dollar"
    health: "fa-stethoscope"
    dentist: "fa-tooth"
    veterinary: "fa-paw"
    supermarket: "fa-cart-shopping"
    convenience: "fa-store"
  # Libelles francais des types de services pour l'affichage.
  service_labels:
    pharmacy: "Pharmacie"
    school: "École"
    kindergarten: "Garderie"
    bank: "Banque"
    health: "Santé"
    dentist: "Dentiste"
    veterinary: "Vétérinaire"
    supermarket: "Épicerie"
    convenience: "Dépanneur"
  # Tailles des pictogrammes, en pixels, et ratio de l'icone dans sa bulle ou son repere.
  size_stop_bubble: 20
  size_station_bubble: 20
  size_service_marker: 22
  size_sector_marker: 34             # carre au centroide d'un secteur, plus gros pour ressortir
  size_sector_marker_offset: 20      # ecart horizontal des deux carres, pour qu'ils restent lisibles sur une meme aire
  size_cluster_marker: 40            # bulle ronde d'un cluster de residences
  size_icon_ratio: 0.55
  # Largeur maximale des infobulles, en pixels.
  size_popup_service: 220
  size_popup_sector: 240
  size_popup_residence: 250
  # Epaisseurs, opacites et pointilles des traits et des points.
  style_study_outline_weight: 2.5
  style_municipal_limits_weight: 2
  style_river_weight: 1
  style_river_fill_opacity: 0.8
  style_network_casing_weight: 2
  style_network_casing_opacity: 0.8
  style_network_fill_weight: 0.8
  style_network_fill_opacity: 1.0
  style_train_line_weight: 2
  style_train_line_dash: "6"
  style_residence_radius: 4
  style_residence_weight: 0.4
  style_residence_fill_opacity: 0.8
  style_sector_fill_opacity: 0.35    # remplissage translucide d'un secteur du levier
  style_sector_outline_weight: 2     # contour d'un secteur du levier
  map_network_simplify_m: 2          # tolerance de simplification du reseau affiche sur les cartes
  # Graphiques statiques (matplotlib).
  chart_dpi: 150
  chart_figsize_bar: [7, 5]          # taille d'un panneau de couverture, largeur totale selon le nombre de panneaux
  chart_figsize_gain: [6, 4.5]       # taille d'un panneau de gain
  chart_zoom_margin: 2.0             # marge verticale (%) resserree sur les valeurs de la courbe de gain
  chart_marker: "o"
  chart_grid_alpha: 0.3
  color_chart_bar: "#185FA5"         # bleu, barres de couverture
  weighting_labels:
    seniors: "Aînés"
    rest: "Reste de la population"
  label_chart_bar_xaxis: "Demande couverte à pied (%)"
  label_chart_gain_xaxis: "Nombre de services ajoutés"
  label_chart_gain_yaxis: "Demande couverte (%)"
  title_coverage: "Couverture actuelle par type de service selon l'ordre de préférence de chaque groupe"
  title_chart_gain: "Gain de couverture selon le nombre de services ajoutés"

# --- Colonnes et etiquettes OpenStreetMap conservees au telechargement ---
osm_columns:
  services: ["amenity", "shop", "healthcare", "name", "geometry"]
  buildings: ["building", "addr:housenumber", "addr:street", "name", "geometry"]
  addresses: ["addr:housenumber", "addr:street", "building", "geometry"]
  water: ["natural", "water", "name", "geometry"]
  commercial: ["landuse", "name", "geometry"]
  residential: ["landuse", "name", "geometry"]
  development: ["landuse", "name", "geometry"]
# Etiquettes OSM des couches telechargees hors de essential_services.
# commercial regroupe commercial et retail, plus simple pour de nouveaux services car les
# locaux et sites sont parfois deja disponibles. development regroupe les terrains a
# developper, friche (brownfield), terrain vierge (greenfield) et chantier (construction).
osm_extra_tags:
  water:
    natural: "water"
  commercial:
    landuse: ["commercial", "retail"]
  residential:
    landuse: "residential"
  development:
    landuse: ["brownfield", "greenfield", "construction"]

# --- Journalisation ---
logging:
  level: "INFO"                      # DEBUG, INFO, WARNING, ERROR

# --- Export ---
export:
  coordinate_precision: 6            # decimales des latitudes et longitudes exportees, environ dix centimetres

# --- Rapport PDF (diffusion des resultats) ---
report:
  course: "GMQ 580 - Géo-informatique II"
  author: "Mylène Giraldeau"
  title: "Où vieillir à pied dans la Vallée du Richelieu, équité d'accès des aînés aux services essentiels et secteurs recommandés"
  logo: "assets/logo_uds.png"        # logo de l'universite en page titre, saute si absent
  output: "outputs/rapport_projet.pdf"
  maps_base_url: "https://girm8601.github.io/GMQ580_PS_MGiraldeau/outputs/maps"  # cartes publiees sur GitHub Pages
  # Mise en page, longueurs en millimetres.
  page_margin_mm: 15                 # marge de la page, sert aussi au saut de page automatique
  logo_width_mm: 70                  # largeur du logo centre sur la page titre
  # Tailles de police, en points.
  font_size_title: 18                # titre du projet, page titre
  font_size_subtitle: 13             # cours, auteur et date, page titre
  font_size_heading: 15              # titre d'un volet
  font_size_body: 11                 # texte courant et liens de cartes
  font_size_table_title: 10          # titre place au dessus d'un tableau
  table_font_size: 8                 # taille de depart du contenu des tableaux
  table_min_font_size: 5             # taille minimale, la police descend jusqu'a ce que le texte tienne dans sa case
  # Couleurs, en composantes rouge, vert et bleu.
  color_heading: [15, 110, 86]       # vert des titres de volets
  color_link: [24, 95, 165]          # bleu des liens vers les cartes
  section_titles:
    diagnostic: "1. Diagnostic d'équité"
    validation: "2. Validation des pistes écartées"
    lever: "3. Levier, la solution retenue"

# --- Chemins ---
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs_maps: "outputs/maps"
  outputs_figures: "outputs/figures"
  outputs_tables: "outputs/tables"
  audit_report: "outputs/tables/audit_report.csv"
  log_file: "logs/pipeline.log"     # journal du pipeline (ignore par Git)
  # Fichiers sources dans data_raw, telecharges manuellement (voir download_data.py)
  manual_files:
    municipal_limits: "decoupages_administratifs_QC/munic_s.shp"
    dissemination_areas: "AD_recensement_2021_CAN/AD_2021.shp"
    census_profile: "donnees_recensement_2021_QC/Francais_CSV_data_Quebec.csv"
    gtfs: "google_transit_VR"
    train_stations: "train_gares_exo.geojson"
    train_lines: "train_lignes_exo.geojson"
  # Couches OSM regenerees par download_data.py, ecrites dans data_processed.
  osm_files:
    walk_graph: "osm/network_walk.graphml"
    services: "osm/services.gpkg"
    buildings: "osm/buildings.gpkg"
    addresses: "osm/addresses.gpkg"
    water: "osm/water.gpkg"
    commercial: "osm/commercial.gpkg"
    residential_landuse: "osm/residential.gpkg"
    development: "osm/development.gpkg"
  # Couches intermediaires ecrites dans data_processed.
  processed_files:
    residences: "residences.gpkg"
    bus_stops: "arrets_bus.gpkg"
    stations: "gares.gpkg"
    dissemination_areas: "aires_diffusion.gpkg"
    development_sites: "sites_developpement.gpkg"
    census_profile: "profil_recensement_filtre.csv"
  # Cartes HTML ecrites dans outputs_maps, seulement le levier. Elles sont versionnees et
  # publiees sur GitHub Pages, voir report.maps_base_url.
  map_files:
    lever_walk: "carte_levier_marche_aines.html"
    lever_transit: "carte_levier_transport_aines.html"
  # Tableaux CSV ecrits dans outputs_tables.
  table_files:
    coverage: "couverture_actuelle.csv"
    comparison: "ecart_aines_reste.csv"
    service_addition: "effet_ajout_services.csv"
    barrier: "effet_barriere.csv"
    crossing_bridges: "ponts_traversants.csv"
    recommendation_walk: "recommandations_marche.csv"
    recommendation_transit: "recommandations_transport.csv"
  # Figures PNG ecrites dans outputs_figures.
  figure_files:
    coverage: "couverture_deux_groupes.png"
    gain: "gain_deux_groupes.png"
