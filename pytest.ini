[pytest]
# La seule regle filtre un avertissement de depreciation interne a pyproj, declenche
# par geopandas lors de la reprojection d'un point. Il vient d'une librairie tierce,
# pas du code du projet, et disparaitra avec une future version de pyproj.
filterwarnings =
    ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning
