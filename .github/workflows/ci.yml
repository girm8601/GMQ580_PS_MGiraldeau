# .github/workflows/ci.yml
# Declenche a chaque push et Pull Request sur main

name: Tests et couverture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier la qualite du code (ruff)
        # Version epinglee, identique au hook pre-commit. Sans epingle, une nouvelle
        # version de ruff active de nouvelles regles et fait echouer un code inchange.
        run: |
          pip install ruff==0.16.0
          ruff check src/ tests/ config_loader.py main.py download_data.py

      - name: Lancer les tests avec couverture
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-couverture
          path: coverage.xml
